name: Build Android
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04 # Stable version for Buildozer
    steps:
      - uses: actions/checkout@v4

      - name: Install Buildozer Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip3 install --user --upgrade Cython==0.29.33 virtualenv
          pip3 install --user --upgrade buildozer
          sudo ln -s ~/.local/bin/cython /usr/local/bin/cython

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # 1. Kill the corrupted internal directory entirely
          rm -rf .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build/venv
          # 2. Run buildozer with a flag to stop it from trying to upgrade pip internally
          # We use 'p4a.branch = master' to get the latest fixes for Python 3.11
          buildozer android debug
        env:
          # Tell python-for-android to stop the internal pip upgrade cycle
          P4A_PIP_UPGRADE: "0"
          BUILDOZER_ALLOW_KIVY_USER: 0

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChD-Android-Package
          path: bin/*.apk

